services:
  goodwe-bridge:
    build: .
    image: goodwe-bridge:local
    container_name: goodwe-bridge
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      GOODWE_HOST: "192.168.20.34"
      GOODWE_FAMILY: "DT"
      BRIDGE_PORT: "8765"
      LAN_TIMEOUT: "2"
      LAN_RETRIES: "3"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
